# Finsuma server side: the YouTube/SoundCloud download service, plus (optionally) Navidrome.
#
#   cp .env.example .env                       # then edit it
#   docker compose up -d                       # download service only
#   docker compose --profile navidrome up -d   # download service + Navidrome
#   add --profile proxy                         # one URL for both (see README)
#
# Downloads go to $MUSIC_DIR/YouTube; point Navidrome at the same $MUSIC_DIR.

services:
  yt-download:
    build: ./yt-download
    container_name: finsuma-yt-download
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      YT_TOKEN: ${YT_TOKEN:?set YT_TOKEN in .env}
      YT_AUTO_UPDATE: ${YT_AUTO_UPDATE:-1}
    ports:
      - "${YT_PORT:-3200}:3200"
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music

  navidrome:
    profiles: [navidrome]
    image: deluan/navidrome:latest
    container_name: finsuma-navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      ND_SCANSCHEDULE: 1h
    ports:
      - "4533:4533"
    volumes:
      - ./navidrome-data:/data
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro

  # Optional: one address for Navidrome and the Finsuma server (/finsuma/...).
  # Point your domain or tunnel at this port instead of at Navidrome directly.
  proxy:
    profiles: [proxy]
    image: caddy:2.8
    container_name: finsuma-proxy
    restart: unless-stopped
    environment:
      # Where Navidrome is, if it is not the navidrome service above.
      NAVIDROME_UPSTREAM: ${NAVIDROME_UPSTREAM:-navidrome:4533}
    ports:
      - "${PROXY_PORT:-4534}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
